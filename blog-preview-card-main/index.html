<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 400;
      src: url('./assets/fonts/Outfit-Regular.ttf') format('truetype');
    }
    h1{font-size: 1.5rem; font-weight: 800; white-space: nowrap;}
    h1:hover { color: hsl(47, 88%, 63%); cursor: pointer; transition: 0.3s ease-in-out;} 
    h1, .author-name{color: hsl(0, 0%, 7%)}
    #tag{background-color: hsl(47, 88%, 63%); color: hsl(0, 0%, 7%); padding: 0.5rem; border-radius: 5px; display: inline-block; margin-bottom: 1rem;}
    #description{color: hsl(0, 0%, 42%);}
    #name{font-size: 1rem; font-weight: 800;}
    p {font-size: 1rem;}
    .author{display: flex; align-items: center; gap: 1rem; margin-top: 2rem;}
    .author img{width: 50px; height: 50px; border-radius: 50%;}
body{background-color: hsl(47, 88%, 63%);}
.container{box-sizing: border-box; max-width: 384px; overflow:hidden;background-color: hsl(0, 0%, 100%); border:1px solid black; border-radius: 10px; padding: 2rem; width: 90%; margin: 3rem auto; box-shadow:10px 10px #000; font-family: 'Outfit', sans-serif;}
 
  </style>
</head>
<body>
<div class="container">
  <p id="tag">Learning</p>

  <p>Published 21 Dec 2023</p>

  <h1>HTML & CSS foundations</h1>

  <p id="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    <div class="author">
      <img src="./assets/images/image-avatar.webp" alt="Author image" />
      <p id="name">By Greg Hooper</p>
    </div>
</div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Iyanuoluwa</a>.
  </footer>
</body>
</html>
