<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Blog preview card</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: clamp(0.625rem, 0.6rem + 0.2vw, 0.75rem); text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
    @font-face {
      font-family: 'Outfit';
      font-style: normal;
      font-weight: 400;
      src: url('./assets/fonts/Outfit-Regular.ttf') format('truetype');
    }
    :root{
      --primary-color: hsl(47, 88%, 63%);
      --secondary-color: hsl(0, 0%, 42%);
      --text-color: hsl(0, 0%, 7%);
    }
    h1{font-size: clamp(1.25rem, 4vw, 1.5rem); font-weight: 800; white-space: normal;}
    h1:hover { color: var(--primary-color); cursor: pointer; } 
    @media (prefers-reduced-motion: reduce) {
      h1:hover { transition: color 0.3s ease-in-out; }
    }
    h1, .author-name{color: var(--text-color);}
    .tag{background-color: var(--primary-color) ; color: var(--text-color); padding: 0.5rem; border-radius: 5px; display: inline-block; margin-block-end: 1rem;}
    .description{color: var(--secondary-color);}
    .name{font-size:clamp(1rem, 0.9rem + 0.5vw, 1.25rem); font-weight: 800;}
    p {font-size: clamp(1rem, 0.9rem + 0.5vw, 1.25rem);}
    .author{display: flex; align-items: center; gap: 1rem; margin-block-start: 2rem;}
    .author img{width: 3.125rem; height: 3.125rem; border-radius: 50%;}
body{background-color: var(--primary-color);}
.container{box-sizing: border-box; overflow:visible;background-color: hsl(0, 0%, 100%); border:1px solid black; border-radius: 10px; padding: clamp(1.5rem, 5vw, 2rem); width:min(24rem, calc(100% - 3rem)); margin: 3rem auto; box-shadow:10px 10px #000; font-family: 'Outfit', sans-serif;}
 
  </style>
</head>
<body>
  <main>
<div class="container">
  <img src="./assets/images/illustration-article.svg" alt="Web 3.0 image" />
  <p class="tag">Learning</p>

  <p class="published">Published 21 Dec 2023</p>

  <h1>HTML & CSS foundations</h1>

  <p class="description">These languages are the backbone of every website, defining structure, content, and presentation.</p>
    <div class="author">
      <img src="./assets/images/image-avatar.webp" alt="Author image" />
      <p class="name">By Greg Hooper</p>
    </div>
</div>
</main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Iyanuoluwa</a>.
  </footer>
</body>
</html>
