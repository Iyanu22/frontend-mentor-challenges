<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
  <title>Frontend Mentor | QR code component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
   .container{max-width: 300px; width: 80%; border-radius: 10px; background-color: hsl(0, 0%, 100%); margin: 5% auto; padding: 20px 20px 24px; box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.2); }
    .container h1{text-align: center; margin-top: 20px; font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 700; color:hsl(218, 44%, 22%);}
    .container p{text-align: center; margin-top: 10px; font-family: 'Outfit', sans-serif; font-size: 12px; font-weight: 400; color: hsl(220, 15%, 55%); }
    .qr-code { display: block; margin: 0 auto; width: 100%; height: auto; border-radius: 10px; }
   body{min-height: 100vh; background-color: hsl(212, 45%, 89%); margin: 0; font-family: 'Outfit', sans-serif; }
  </style>
</head>
<body>
  <div class="container">
<img src="./images/image-qr-code.png" alt="QR code" class="qr-code">
 <h1>Improve your front-end skills by building projects</h1>

  <p>Scan the QR code to visit Frontend Mentor and take your coding skills to the next level</p>
  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Iyanu</a>.
  </footer>
</body>
</html>
