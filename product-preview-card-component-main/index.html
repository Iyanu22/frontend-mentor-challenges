<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
  <div class="container">
 <div class="image-container">   
      <picture>
<source media="(max-width: 600px)" srcset="./images/image-product-mobile.jpg"/>
<img src="./images/image-product-desktop.jpg" alt ="Gabrielle Essence Eau De Parfum"/>
      </picture>
      </div>  
      <div class="text-container">
 <p class="category">Perfume</p>

 <h1>Gabrielle Essence Eau De Parfum</h1>

 <p class="description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>
 <div class="price">
  <span class="final-price">$149.99</span>
  <span class="initial-price">$169.99</span>
  </div>

 <button><img src="./images/icon-cart.svg" alt="" aria-hidden="true"> Add to Cart</button>
 </div>
</div>
</main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Iyanuoluwa</a>.
  </footer>
</body>
</html>
